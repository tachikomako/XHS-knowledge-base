<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书个人知识库</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">知</div>
        <div>
          <h1>小红书个人知识库</h1>
          <p>手动同步收藏和点赞</p>
          <p class="build-id" id="extensionBuild">Build loading</p>
        </div>
      </header>

      <section class="status-card" id="statusCard" aria-live="polite">
        <span class="status-dot"></span>
        <div>
          <strong id="statusTitle">尚未检查连接</strong>
          <p id="statusDetail">请先启动本地后端</p>
        </div>
      </section>

      <section class="sync-card" aria-live="polite">
        <span class="eyebrow">手动同步</span>
        <div class="sync-options">
          <label class="checkbox-row"><input id="sourceFavorite" type="checkbox" checked /> 我的收藏</label>
          <label class="checkbox-row"><input id="sourceLiked" type="checkbox" /> 我的点赞</label>
        </div>
        <p class="sync-mode">默认快速同步列表，不打开详情页。</p>
        <label class="checkbox-row"><input id="completeFavoriteContent" type="checkbox" /> 补全收藏正文</label>
        <label class="checkbox-row"><input id="aiAfterSync" type="checkbox" checked /> 同步后自动生成摘要、分类和标签</label>
        <button type="button" class="primary" id="startSyncButton">开始同步</button>
        <p class="capture-result" id="syncResult"></p>
        <p class="latest-sync" id="latestSync">最近同步：暂无记录</p>
      </section>

      <details class="capture-card" id="captureCard" aria-live="polite">
        <summary>调试与单篇剪藏</summary>
        <span class="eyebrow">当前页面</span>
        <h2 id="captureTitle">正在识别…</h2>
        <p id="captureMeta">请稍候</p>
        <ul id="captureWarnings" hidden></ul>
        <div class="capture-actions">
          <button type="button" class="primary" id="captureButton" disabled>识别当前页面</button>
          <button type="button" class="rescan-button" id="rescanButton">重新扫描</button>
        </div>
        <p class="capture-result" id="captureResult"></p>
        <details class="diagnostic-panel" id="diagnosticPanel" hidden>
          <summary>适配诊断（不包含帖子内容）</summary>
          <textarea id="diagnosticText" rows="5" readonly></textarea>
          <button type="button" class="copy-button" id="copyDiagnostics">复制诊断</button>
        </details>
      </details>

      <button type="button" class="secondary" id="openKnowledgeBase">打开知识库</button>

      <details>
        <summary>连接设置</summary>
        <form id="settingsForm">
          <label>
            后端地址
            <input id="backendUrl" name="backendUrl" type="url" required />
          </label>
          <label>
            知识库地址
            <input id="knowledgeBaseUrl" name="knowledgeBaseUrl" type="url" required />
          </label>
          <label>
            本地访问令牌
            <input
              id="extensionToken"
              name="extensionToken"
              type="password"
              autocomplete="off"
              placeholder="例如 dev-local-token"
            />
          </label>
          <button type="submit" class="settings-button">保存并检查连接</button>
        </form>
      </details>
      <p class="privacy-note">扩展不会读取或上传 Cookie、密码和验证码。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
