<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小红书个人知识库</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-mark">知</div>
        <div>
          <h1>小红书个人知识库</h1>
          <p>把当前帖子保存到本地</p>
        </div>
      </header>

      <section class="status-card" id="statusCard" aria-live="polite">
        <span class="status-dot"></span>
        <div>
          <strong id="statusTitle">尚未检查连接</strong>
          <p id="statusDetail">请先启动本地后端</p>
        </div>
      </section>

      <section class="capture-card" id="captureCard" aria-live="polite">
        <span class="eyebrow">当前页面</span>
        <h2 id="captureTitle">正在识别…</h2>
        <p id="captureMeta">请稍候</p>
        <ul id="captureWarnings" hidden></ul>
        <button type="button" class="primary" id="clipCurrentPost" disabled>剪藏当前帖子</button>
        <p class="capture-result" id="captureResult"></p>
      </section>

      <button type="button" class="secondary" id="openKnowledgeBase">打开知识库</button>

      <details>
        <summary>连接设置</summary>
        <form id="settingsForm">
          <label>
            后端地址
            <input id="backendUrl" name="backendUrl" type="url" required />
          </label>
          <label>
            知识库地址
            <input id="knowledgeBaseUrl" name="knowledgeBaseUrl" type="url" required />
          </label>
          <label>
            本地访问令牌
            <input
              id="extensionToken"
              name="extensionToken"
              type="password"
              autocomplete="off"
              placeholder="例如 dev-local-token"
            />
          </label>
          <button type="submit" class="settings-button">保存并检查连接</button>
        </form>
      </details>
      <p class="privacy-note">扩展不会读取或上传 Cookie、密码和验证码。</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
